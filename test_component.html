<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Bileşenleri Test Sayfası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      color: #333;
      background-color: #f5f5f7;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 30px;
      text-align: center;
      padding: 20px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #e83e8c;
    }
    
    .subtitle {
      font-size: 16px;
      color: #666;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .component-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .card {
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    
    .card-header {
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .card-title {
      font-weight: 600;
      color: #7b2cbf;
      font-size: 18px;
    }
    
    .card-body {
      padding: 20px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .card-footer {
      padding: 15px 20px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
    }
    
    /* UI Component Styles */
    .btn {
      display: inline-block;
      border-radius: 6px;
      padding: 8px 16px;
      background-color: #e83e8c;
      color: white;
      font-weight: 500;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .btn:hover {
      background-color: #d02e7a;
    }
    
    .btn-secondary {
      background-color: #7b2cbf;
    }
    
    .btn-secondary:hover {
      background-color: #6a24a5;
    }
    
    .btn-outline {
      background-color: transparent;
      border: 1px solid #e83e8c;
      color: #e83e8c;
    }
    
    .btn-outline:hover {
      background-color: #fff0f6;
    }
    
    /* Animation Demo */
    .animation-box {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e83e8c, #7b2cbf);
      margin: 0 auto;
    }
    
    .animation-fade {
      animation: fadeIn 2s infinite alternate;
    }
    
    .animation-bounce {
      animation: bounce 1s infinite alternate;
    }
    
    .animation-rotate {
      animation: rotate 3s linear infinite;
    }
    
    .animation-pulse {
      animation: pulse 2s infinite;
    }
    
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 30px;
      grid-gap: 10px;
      width: 100%;
    }
    
    .masonry-item {
      border-radius: 6px;
      background-color: #e83e8c;
      grid-row-end: span var(--span);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 500;
    }
    
    .confetti-container {
      position: relative;
      width: 200px;
      height: 150px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0;
    }
    
    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    @keyframes confettiFall {
      0% { transform: translateY(-20px); opacity: 1; }
      100% { transform: translateY(150px); opacity: 0; }
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .component-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      
      .title {
        font-size: 24px;
      }
    }
    
    @media (max-width: 480px) {
      .component-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">UI Bileşenleri Test Sayfası</h1>
      <p class="subtitle">Bu sayfa, uygulamada kullanılan animasyon ve UI bileşenlerini test etmek için oluşturulmuştur.</p>
    </header>
    
    <div class="component-grid">
      <!-- Fade Animation -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Fade Animasyonu</h2>
        </div>
        <div class="card-body">
          <div class="animation-box animation-fade"></div>
        </div>
        <div class="card-footer">
          <button class="btn" onclick="resetAnimation(this)">Yenile</button>
        </div>
      </div>
      
      <!-- Bounce Animation -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Bounce Animasyonu</h2>
        </div>
        <div class="card-body">
          <div class="animation-box animation-bounce"></div>
        </div>
        <div class="card-footer">
          <button class="btn" onclick="resetAnimation(this)">Yenile</button>
        </div>
      </div>
      
      <!-- Rotate Animation -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Rotate Animasyonu</h2>
        </div>
        <div class="card-body">
          <div class="animation-box animation-rotate"></div>
        </div>
        <div class="card-footer">
          <button class="btn" onclick="resetAnimation(this)">Yenile</button>
        </div>
      </div>
      
      <!-- Pulse Animation -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Pulse Animasyonu</h2>
        </div>
        <div class="card-body">
          <div class="animation-box animation-pulse"></div>
        </div>
        <div class="card-footer">
          <button class="btn" onclick="resetAnimation(this)">Yenile</button>
        </div>
      </div>
      
      <!-- Masonry Grid -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Masonry Grid</h2>
        </div>
        <div class="card-body">
          <div class="masonry-grid" id="masonryGrid">
            <!-- Items will be added via JavaScript -->
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-secondary" onclick="regenerateMasonry()">Yeniden Oluştur</button>
        </div>
      </div>
      
      <!-- Confetti Effect -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Konfeti Efekti</h2>
        </div>
        <div class="card-body">
          <div class="confetti-container" id="confettiContainer"></div>
        </div>
        <div class="card-footer">
          <button class="btn btn-secondary" onclick="showConfetti()">Konfeti Göster</button>
        </div>
      </div>
    </div>
    
    <div class="card" style="margin-bottom: 40px;">
      <div class="card-header">
        <h2 class="card-title">Buton Stilleri</h2>
      </div>
      <div class="card-body" style="flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 16px;">
        <button class="btn">Standart Buton</button>
        <button class="btn btn-secondary">İkincil Buton</button>
        <button class="btn btn-outline">Outline Buton</button>
      </div>
    </div>
  </div>
  
  <script>
    // Initialize the page
    window.onload = function() {
      regenerateMasonry();
    };
    
    // Reset animation by cloning and replacing the element
    function resetAnimation(button) {
      const card = button.closest('.card');
      const animationBox = card.querySelector('.animation-box');
      const newBox = animationBox.cloneNode(true);
      animationBox.parentNode.replaceChild(newBox, animationBox);
    }
    
    // Create masonry grid
    function regenerateMasonry() {
      const grid = document.getElementById('masonryGrid');
      grid.innerHTML = '';
      
      for (let i = 1; i <= 9; i++) {
        const item = document.createElement('div');
        item.className = 'masonry-item';
        
        // Random height (span)
        const span = Math.floor(Math.random() * 3) + 2; // 2-4 spans
        item.style.setProperty('--span', span);
        
        // Adjust colors
        if (i % 3 === 0) {
          item.style.backgroundColor = '#7b2cbf';
        } else if (i % 3 === 1) {
          item.style.backgroundColor = '#e83e8c';
        } else {
          item.style.backgroundColor = '#3a0ca3';
        }
        
        item.textContent = i;
        grid.appendChild(item);
      }
    }
    
    // Show confetti effect
    function showConfetti() {
      const container = document.getElementById('confettiContainer');
      container.innerHTML = '';
      
      const colors = ['#e83e8c', '#7b2cbf', '#3a0ca3', '#4cc9f0', '#f72585'];
      
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        
        // Random position, size, color
        const left = Math.random() * 100;
        const size = Math.random() * 8 + 6;
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        confetti.style.left = `${left}%`;
        confetti.style.width = `${size}px`;
        confetti.style.height = `${size}px`;
        confetti.style.backgroundColor = color;
        
        // Random rotation
        const rotation = Math.random() * 360;
        confetti.style.transform = `rotate(${rotation}deg)`;
        
        // Random delay
        const delay = Math.random() * 0.5;
        confetti.style.animation = `confettiFall 1.5s ease-out ${delay}s`;
        
        container.appendChild(confetti);
      }
    }
  </script>
</body>
</html>
