<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı - Nail Art Match</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f472b6">
  <style>
    :root {
      --primary: #f472b6;
      --text-primary: #333;
      --text-secondary: #666;
      --bg-primary: #ffffff;
      --border: #eaeaea;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #f472b6;
        --text-primary: #f0f0f0;
        --text-secondary: #a0a0a0;
        --bg-primary: #1a1a1a;
        --border: #333;
      }
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .container {
      max-width: 90%;
      width: 500px;
      padding: 20px;
    }
    
    h1 {
      color: var(--primary);
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      background-color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: auto;
      margin-right: auto;
    }
    
    .icon svg {
      width: 60px;
      height: 60px;
      color: white;
    }
    
    .button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(244, 114, 182, 0.2);
    }
    
    .button:hover {
      background-color: #e759a8;
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(244, 114, 182, 0.3);
    }
    
    .button:active {
      transform: translateY(0);
      box-shadow: 0 2px 4px rgba(244, 114, 182, 0.2);
    }
    
    .footer {
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-4.5-8.599A5.5 5.5 0 003 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <h1>Çevrimdışı Modu</h1>
    <p>Görünüşe göre internet bağlantınızda bir sorun var. Nail Art Match'i kullanmak için çevrimiçi olmanız gerekiyor.</p>
    <p>Lütfen internet bağlantınızı kontrol edip tekrar deneyin.</p>
    <button class="button" id="reloadButton">Yenile</button>
    <div class="footer">
      <p>&copy; 2025 Nail Art Match. Tüm hakları saklıdır.</p>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Sayfayı yenileme butonu
      const reloadButton = document.getElementById('reloadButton');
      if (reloadButton) {
        reloadButton.addEventListener('click', function() {
          window.location.reload();
        });
      }
      
      // Dili kontrol etme (localStorage'dan veya navigator.language)
      let userLang = 'tr'; // Default olarak Türkçe
      
      if (typeof localStorage !== 'undefined' && localStorage.getItem('locale')) {
        userLang = localStorage.getItem('locale');
      } else if (navigator.language) {
        const browserLang = navigator.language.split('-')[0];
        if (['en', 'ar'].includes(browserLang)) {
          userLang = browserLang;
        }
      }
      
      // Dile göre içeriği değiştir
      if (userLang === 'en') {
        document.title = 'Offline - Nail Art Match';
        document.querySelector('h1').textContent = 'Offline Mode';
        document.querySelectorAll('p')[0].textContent = 'It seems there is an issue with your internet connection. You need to be online to use Nail Art Match.';
        document.querySelectorAll('p')[1].textContent = 'Please check your internet connection and try again.';
        document.getElementById('reloadButton').textContent = 'Refresh';
        document.querySelectorAll('p')[2].textContent = '© 2025 Nail Art Match. All rights reserved.';
      } else if (userLang === 'ar') {
        document.documentElement.dir = 'rtl';
        document.documentElement.lang = 'ar';
        document.title = 'وضع عدم الاتصال - نيل آرت ماتش';
        document.querySelector('h1').textContent = 'وضع عدم الاتصال';
        document.querySelectorAll('p')[0].textContent = 'يبدو أن هناك مشكلة في اتصالك بالإنترنت. تحتاج إلى الاتصال بالإنترنت لاستخدام نيل آرت ماتش.';
        document.querySelectorAll('p')[1].textContent = 'يرجى التحقق من اتصالك بالإنترنت والمحاولة مرة أخرى.';
        document.getElementById('reloadButton').textContent = 'تحديث';
        document.querySelectorAll('p')[2].textContent = '© 2025 نيل آرت ماتش. جميع الحقوق محفوظة.';
      }
    });
  </script>
</body>
</html>
