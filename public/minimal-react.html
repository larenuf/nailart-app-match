<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal React Test</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
      color: #333;
      background-color: #f9f9f9;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .card {
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
      overflow: hidden;
      padding: 1.5rem;
    }
    
    .button {
      display: inline-block;
      background-color: #e83e8c;
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 0.35rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .button:hover {
      background-color: #d03077;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"></div>
  </div>
  
  <script type="text/babel">
    // Simple React Component
    function App() {
      const [count, setCount] = React.useState(0);
      
      return (
        <div>
          <div className="card">
            <h1>Minimal React Test</h1>
            <p>Bu basit bir React uygulamasının test sayfasıdır. CDN üzerinden yüklenen React ve ReactDOM kullanılmıştır.</p>
            
            <div>
              <h2>Sayaç: {count}</h2>
              <button 
                className="button" 
                onClick={() => setCount(count + 1)}
              >
                Artır
              </button>
              <button 
                className="button" 
                style={{marginLeft: '10px', backgroundColor: '#7b2cbf'}}
                onClick={() => setCount(0)}
              >
                Sıfırla
              </button>
            </div>
          </div>
          
          <div className="card">
            <h2>React Kontrol Listesi</h2>
            <ul>
              <li>React CDN'den yükleniyor</li>
              <li>React 18 kullanılıyor</li>
              <li>Babel ile JSX dönüşümü yapılıyor</li>
              <li>useState hook'u kullanılıyor</li>
            </ul>
          </div>
        </div>
      );
    }
    
    // Render the App component to the DOM
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
