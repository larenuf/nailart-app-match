<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nail Art Match - Basitleştirilmiş Uygulama</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Özel Stiller */
    body {
      background-color: #f9f9f9;
    }
    
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }
    
    .card:hover {
      transform: translateY(-5px);
    }

    /* Animasyonlar */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    // SalonCard Bileşeni
    const SalonCard = ({ salon, onClick }) => {
      return (
        <div 
          className="card bg-white p-4 mb-4 fade-in cursor-pointer"
          onClick={() => onClick(salon)}
        >
          <div 
            className="h-40 bg-cover bg-center rounded-lg mb-3" 
            style={{ backgroundImage: `url(${salon.imageUrl})` }}
          ></div>
          <h3 className="text-xl font-bold text-gray-800">{salon.name}</h3>
          <p className="text-gray-600 mb-2">{salon.address}</p>
          <div className="flex items-center mb-2">
            <span className="text-yellow-500 mr-1">★</span>
            <span>{salon.rating} ({salon.reviewCount} değerlendirme)</span>
          </div>
          <div className="flex justify-between items-center">
            <span className="text-pink-600 font-semibold">{salon.openTime} - {salon.closeTime}</span>
            {salon.discount && (
              <span className="bg-pink-100 text-pink-800 px-2 py-1 rounded-full text-xs font-semibold">
                {salon.discount}
              </span>
            )}
          </div>
        </div>
      )
    };

    // HomePage Bileşeni
    const HomePage = ({ onSelectSalon }) => {
      const [salons, setSalons] = React.useState([
        {
          id: 1,
          name: "NAM Nail Studio",
          address: "Bağdat Caddesi No: 123, Kadıköy",
          rating: 4.8,
          reviewCount: 128,
          openTime: "09:00",
          closeTime: "20:00",
          imageUrl: "https://images.unsplash.com/photo-1632345031435-8727f6897d53",
          discount: "%15 İndirim"
        },
        {
          id: 2,
          name: "Bella Nails",
          address: "Teşvikiye Mah. Bronz Sokak, Nişantaşı",
          rating: 4.6,
          reviewCount: 94,
          openTime: "10:00",
          closeTime: "19:00",
          imageUrl: "https://images.unsplash.com/photo-1604654894610-df63bc536371",
          discount: ""
        },
        {
          id: 3,
          name: "Elite Nail Bar",
          address: "Bebek Mah. Cevdet Paşa Cad. No:42, Bebek",
          rating: 4.9,
          reviewCount: 215,
          openTime: "09:00",
          closeTime: "21:00",
          imageUrl: "https://images.unsplash.com/photo-1519014816548-bf5fe059798b",
          discount: "Yeni Müşterilere Özel"
        },
      ]);
      
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState(null);
      
      // Salon tıklama işleyicisi
      const handleSalonClick = (salon) => {
        onSelectSalon(salon);
      };
      
      return (
        <div className="container mx-auto px-4 py-8">
          <header className="mb-8 text-center">
            <h1 className="text-4xl font-bold text-pink-600 mb-2">Nail Art Match</h1>
            <p className="text-gray-600">Basitleştirilmiş Uygulaması</p>
          </header>
          
          <div className="mb-6 bg-pink-50 rounded-lg p-4 border border-pink-100">
            <p className="text-pink-800">
              Bu, Nail Art Match uygulamasının basitleştirilmiş bir versiyonudur. 
              SalonDetailView ve diğer bileşenleri statik HTML içinde göstermek için oluşturulmuştur.
              WebSocket olmadan çalışır ve geliştirme ortamında test edilebilir.
            </p>
          </div>
          
          <div className="mb-8">
            <h2 className="text-2xl font-bold text-gray-800 mb-4">Popüler Salonlar</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {salons.map(salon => (
                <SalonCard 
                  key={salon.id} 
                  salon={salon} 
                  onClick={handleSalonClick}
                />
              ))}
            </div>
          </div>
          
          <div className="p-4 bg-white rounded-lg shadow">
            <h2 className="text-2xl font-bold text-gray-800 mb-4">Uygulama Durumu</h2>
            <div className="space-y-2">
              <p><strong>Salon Sayısı:</strong> {salons.length}</p>
              <p><strong>Yükleniyor:</strong> {loading ? "Evet" : "Hayır"}</p>
              <p><strong>Hata:</strong> {error ? error : "Yok"}</p>
              <button 
                className="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded mt-4"
                onClick={() => {
                  setLoading(true);
                  setTimeout(() => {
                    const newSalon = {
                      id: salons.length + 1,
                      name: "Yeni Salon " + (salons.length + 1),
                      address: "İstanbul, Türkiye",
                      rating: 4.5,
                      reviewCount: 10,
                      openTime: "10:00",
                      closeTime: "18:00",
                      imageUrl: "https://images.unsplash.com/photo-1519014816548-bf5fe059798b",
                      discount: ""
                    };
                    setSalons([...salons, newSalon]);
                    setLoading(false);
                  }, 1000);
                }}
              >
                {loading ? "Yükleniyor..." : "Salon Ekle"}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // SalonDetailView Bileşeni
    const SalonDetailView = ({ salon, onBack }) => {
      const [activeTab, setActiveTab] = React.useState('services');
      
      // Örnek hizmetler
      const services = [
        { id: 1, name: "Klasik Manikür", price: 25, durationMinutes: 30, description: "Tırnak şekillendirme, törpüleme ve oje sürme" },
        { id: 2, name: "Klasik Pedikür", price: 35, durationMinutes: 45, description: "Ayak bakımı, tırnak şekillendirme ve oje" },
        { id: 3, name: "Jel Tırnak", price: 50, durationMinutes: 60, description: "Uzun süre dayanıklı jel tırnak uygulaması" },
        { id: 4, name: "Kalıcı Oje", price: 40, durationMinutes: 45, description: "2-3 hafta dayanan kalıcı oje uygulaması" }
      ];
      
      // Örnek sanatçılar
      const artists = [
        { id: 1, name: "Ayşe Yılmaz", specialty: "Jel Tırnak Uzmanı", rating: 4.8, reviewCount: 42, imageUrl: "https://randomuser.me/api/portraits/women/44.jpg" },
        { id: 2, name: "Zeynep Kaya", specialty: "Nail Art Uzmanı", rating: 4.9, reviewCount: 37, imageUrl: "https://randomuser.me/api/portraits/women/68.jpg" },
        { id: 3, name: "Merve Demir", specialty: "Kalıcı Oje Uzmanı", rating: 4.7, reviewCount: 28, imageUrl: "https://randomuser.me/api/portraits/women/54.jpg" }
      ];
      
      const galleryImages = [
        salon.imageUrl,
        "https://images.unsplash.com/photo-1604654894610-df63bc536371",
        "https://images.unsplash.com/photo-1519014816548-bf5fe059798b",
        "https://images.unsplash.com/photo-1632345031435-8727f6897d53",
        "https://images.unsplash.com/photo-1522337660859-02fbefca4702"
      ];
      
      return (
        <div className="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
          {/* Header ve Geri butonu */}
          <div className="bg-white p-4 flex items-center border-b">
            <button onClick={onBack} className="mr-2 text-gray-800">
              ← Geri
            </button>
            <h2 className="text-lg font-bold">{salon.name}</h2>
            {salon.discount && (
              <span className="ml-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full">
                {salon.discount}
              </span>
            )}
          </div>
          
          {/* Salon Kapak Resmi */}
          <div 
            className="h-48 bg-cover bg-center relative"
            style={{ backgroundImage: `url(${salon.imageUrl})` }}
          >
            {/* Kapak üzerindeki bilgiler */}
            <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black to-transparent text-white">
              <h1 className="text-xl font-bold">{salon.name}</h1>
              <div className="flex items-center text-sm">
                <span className="mr-1">📍</span>
                <span>{salon.address}</span>
              </div>
            </div>
          </div>
          
          {/* Derecelendirme ve Temel Bilgiler */}
          <div className="p-4">
            <div className="flex justify-between items-center mb-2">
              <div className="flex items-center">
                <div className="text-yellow-500">
                  {'★'.repeat(Math.floor(salon.rating))}
                  {salon.rating % 1 > 0 ? '☆' : ''}
                </div>
                <span className="text-sm ml-1 text-gray-600">
                  {salon.rating.toFixed(1)} ({salon.reviewCount} yorum)
                </span>
              </div>
              <div className="flex space-x-2">
                <button className="bg-white border border-gray-200 p-2 rounded-full">
                  📤
                </button>
                <button className="bg-pink-100 p-2 rounded-full">
                  ❤️
                </button>
              </div>
            </div>
            
            <div className="flex flex-wrap gap-2 mb-3">
              <div className="flex items-center text-sm bg-gray-100 px-3 py-1 rounded-full">
                <span>🕒 {salon.openTime} - {salon.closeTime}</span>
              </div>
              <div className="flex items-center text-sm bg-gray-100 px-3 py-1 rounded-full">
                <span>📞 +90 212 555 1234</span>
              </div>
            </div>
          </div>
          
          {/* Sekmeler */}
          <div className="px-4 border-b">
            <div className="flex border-b">
              <button 
                onClick={() => setActiveTab('services')} 
                className={`py-2 px-4 ${activeTab === 'services' ? 'border-b-2 border-pink-500 text-pink-600' : 'text-gray-600'}`}
              >
                Hizmetler
              </button>
              <button 
                onClick={() => setActiveTab('artists')} 
                className={`py-2 px-4 ${activeTab === 'artists' ? 'border-b-2 border-pink-500 text-pink-600' : 'text-gray-600'}`}
              >
                Sanatçılar
              </button>
              <button 
                onClick={() => setActiveTab('gallery')} 
                className={`py-2 px-4 ${activeTab === 'gallery' ? 'border-b-2 border-pink-500 text-pink-600' : 'text-gray-600'}`}
              >
                Galeri
              </button>
            </div>
          </div>
          
          {/* Sekme İçeriği */}
          <div className="p-4">
            {/* Hizmetler Sekmesi */}
            {activeTab === 'services' && (
              <div>
                <h3 className="font-bold mb-3">Randevu Alabileceğiniz Hizmetler</h3>
                <div className="space-y-3">
                  {services.map(service => (
                    <div key={service.id} className="p-3 border border-gray-100 rounded-lg hover:shadow-md transition-all">
                      <div className="flex justify-between">
                        <h4 className="font-medium">{service.name}</h4>
                        <span className="font-bold">${service.price}</span>
                      </div>
                      <p className="text-sm text-gray-600 my-1">{service.description}</p>
                      <div className="flex justify-between items-center mt-2">
                        <span className="text-xs text-gray-500">{service.durationMinutes} dakika</span>
                        <button className="text-xs bg-pink-100 hover:bg-pink-200 text-pink-800 px-3 py-1 rounded-full">
                          Randevu Al
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {/* Sanatçılar Sekmesi */}
            {activeTab === 'artists' && (
              <div>
                <h3 className="font-bold mb-3">Tırnak Sanatçılarımız</h3>
                <div className="space-y-3">
                  {artists.map(artist => (
                    <div key={artist.id} className="flex p-3 border border-gray-100 rounded-lg hover:shadow-md cursor-pointer transition-all">
                      <img 
                        src={artist.imageUrl} 
                        alt={artist.name} 
                        className="w-16 h-16 rounded-full object-cover"
                      />
                      <div className="ml-3 flex-1">
                        <h4 className="font-medium">{artist.name}</h4>
                        <p className="text-sm text-gray-600">{artist.specialty}</p>
                        <div className="flex items-center mt-1">
                          <div className="text-yellow-500 text-xs">
                            {'★'.repeat(Math.floor(artist.rating))}
                            {artist.rating % 1 > 0 ? '☆' : ''}
                          </div>
                          <span className="text-xs ml-1 text-gray-500">
                            ({artist.reviewCount} yorum)
                          </span>
                        </div>
                      </div>
                      <div className="flex items-center">
                        <button className="text-gray-400">
                          &gt;
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            
            {/* Galeri Sekmesi */}
            {activeTab === 'gallery' && (
              <div>
                <h3 className="font-bold mb-3">Salon Galerisi</h3>
                <div className="grid grid-cols-2 gap-2">
                  {galleryImages.map((image, index) => (
                    <div 
                      key={index}
                      className={`rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-all ${index === 0 ? 'col-span-2' : ''}`}
                    >
                      <img 
                        src={image} 
                        alt={`Salon image ${index + 1}`} 
                        className="w-full h-full object-cover"
                      />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Ana Uygulama Bileşeni
    const App = () => {
      const [selectedSalon, setSelectedSalon] = React.useState(null);
      
      if (selectedSalon) {
        return <SalonDetailView salon={selectedSalon} onBack={() => setSelectedSalon(null)} />;
      }
      
      return (
        <HomePage onSelectSalon={setSelectedSalon} />
      );
    };
    
    // React uygulamasını DOM'a bağlama
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
