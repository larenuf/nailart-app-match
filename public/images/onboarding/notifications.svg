<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Character frame -->
  <rect x="100" y="120" width="100" height="10" stroke="#333" stroke-width="1" fill="#DDD" />
  
  <!-- Character on skateboard -->
  <rect x="130" y="95" width="40" height="10" fill="#666" rx="2" />
  
  <!-- Character -->
  <path d="M150,50 Q130,70 130,95" stroke="#333" stroke-width="1" fill="none" />
  <circle cx="150" cy="40" r="15" fill="#555" />
  <rect x="145" y="40" width="30" height="40" rx="15" fill="#F9C9BC" />
  <rect x="135" y="60" width="30" height="50" rx="5" fill="#30AAB9" />
  <path d="M150,80 Q170,60 175,40" stroke="#333" stroke-width="1" fill="none" />
  
  <!-- Phone -->
  <rect x="170" y="50" width="15" height="25" rx="2" fill="#30AAB9" />
  <rect x="172" y="52" width="11" height="18" rx="1" fill="white" />
  
  <!-- Notification bubble -->
  <circle cx="185" cy="40" r="12" fill="white" stroke="#333" stroke-width="1" />
  <text x="185" y="45" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">TUE, 1:00 P.M.</text>
  
  <!-- Cloud -->
  <path d="M220,50 Q230,40 240,50 Q250,40 260,50 Q270,40 270,50 Q280,60 270,70 Q280,80 270,85 Q260,95 250,85 Q240,95 230,85 Q220,95 220,85 Q210,80 220,70 Q210,60 220,50" fill="#F5F5F5" />
</svg>